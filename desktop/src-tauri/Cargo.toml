[package]
name = "portscanner-desktop"
version = "1.1.0"
description = "Unified system monitor and port scanner"
authors = ["Bibek Tripathy"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Readiness handshake with the sidecar (Notify + timeout) runs on Tauri's runtime.
tokio = { version = "1", features = ["sync", "time"] }
rand = "0.9"
# Requests to monitored machines are made here in Rust rather than in the webview:
# the webview is a secure context, so it would refuse plain-HTTP calls to a server on
# the LAN as mixed content, and we would also have to care about CORS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
