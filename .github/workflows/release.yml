name: Build and Release

# Tag a commit to publish: `git tag v0.3.0 && git push origin v0.3.0`.
#
# Produces, for each tag:
#   * desktop installers  - .deb / .rpm / .AppImage (Linux) and .msi / .exe (Windows)
#   * headless binaries   - a single-file server you can drop on a box with no Docker
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites. Ubuntu 22.04 is used deliberately: glibc and
      # webkit2gtk here are old enough for the bundles to run on newer distros too.
      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev only; it conflicts with the older
          # libappindicator3-dev, and installing both fails the job.
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Freezes backend/server.py into desktop/src-tauri/binaries/ under the name
      # Tauri expects for a sidecar (<name>-<target triple>).
      - name: Build backend sidecar
        working-directory: desktop
        run: node scripts/build-sidecar.mjs

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build desktop bundles
        working-directory: desktop
        run: npx tauri build

      - name: Upload installers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  headless:
    name: Headless server binary (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
            artifact: portScanner-linux
          - os: windows-latest
            label: windows
            artifact: portScanner-windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      # One file that serves both the API and the UI: `./portScanner-linux --open`
      - name: Build binary (Linux)
        if: matrix.label == 'linux'
        run: |
          pyinstaller --onefile --name portScanner-linux \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "backend/config/criticalPorts.yaml:backend/config" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --paths backend \
            backend/server.py

      - name: Build binary (Windows)
        if: matrix.label == 'windows'
        run: |
          pyinstaller --onefile --name portScanner-windows `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "backend/config/criticalPorts.yaml;backend/config" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --paths backend `
            backend/server.py

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: dist/${{ matrix.artifact }}
